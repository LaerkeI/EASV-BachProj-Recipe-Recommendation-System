services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    # volumes:
    #   - kafka_data:/var/lib/kafka/data
    #   - ./kafka-init/create-topics.sh:/docker-entrypoint-initdb.d/create-topics.sh
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - recipe_recommendation_network

  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
    networks:
      - recipe_recommendation_network

  recipe_graph:
    container_name: recipe_graph
    image: neo4j:5.25-community
    ports:
      - "7474:7474" #Browser UI
      - "7687:7687" #Bolt port
    environment:
      NEO4J_AUTH: neo4j/MySuperStrongPassword123
      NEO4J_dbms_default__database: recipe-graph
    volumes:
      - neo4j_recipe_data:/data/neo4j/recipe
      # Mount the Neo4j folder containing entrypoint + migrations
      - ./RecommendationGraphProjectionService/Infrastructure/Neo4j:/var/lib/neo4j/import
    entrypoint: ["/var/lib/neo4j/import/neo4j_entrypoint.sh"]
    networks:
      - recipe_recommendation_network

  recipe_graph_projection_service:
    container_name: "recipe_graph_projection_service"
    build:
      context: .
      dockerfile: RecommendationGraphProjectionService/Dockerfile
    depends_on:
      recipe_graph:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
    - recipe_recommendation_network

  recipe_management_service:
    container_name: "recipe_management_service"
    build:
      context: .
      dockerfile: RecipeManagementService/Dockerfile
    ports:
      - "7001:8080"
    depends_on:
      - kafka
    #   - recommendation_graph
    networks:
    - recipe_recommendation_network
    
