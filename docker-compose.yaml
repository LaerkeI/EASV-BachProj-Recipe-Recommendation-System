  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   depends_on:
  #     - zookeeper
  #   networks:
  #     - recipe_recommendation_network

  recipe_mongodb_server:
    image: mongodb/mongodb-community-server:7.0.5-ubuntu2204
    container_name: recipe_mongodb_server
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=user
      - MONGODB_INITDB_ROOT_PASSWORD=pass
    volumes:
      - mongo_recipe_data:/data/db
      - ./RecipeManagementService/Infrastructure/MongoDB/Migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - recipe_recommendation_network


volumes:
  kafka_data:
  neo4j_recipe_data:
  mongo_recipe_data:

networks:
  recipe_recommendation_network:
    driver: bridge

